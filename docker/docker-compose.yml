services:

  ti-knowledge-db:
    image: postgres:17
    container_name: ti-knowledge-db
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: qwerty

    ports:
      - "5432:5432"
    volumes:
      # initialization scripts
      - ./knowledge-init-scripts:/docker-entrypoint-initdb.d
      # PostgreSQL data
      - knowledge-db-data:/var/lib/postgresql/data

    networks:
      - knowledge-network

volumes:
  knowledge-db-data:
networks:
  knowledge-network:
    name: knowledge-network