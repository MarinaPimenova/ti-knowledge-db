version: "3.9"
services:
  study-postgres:
    container_name: study-postgres-14
    image: postgres:14.4
    environment:
      POSTGRES_DB: "knowledge_db"
      POSTGRES_USER: "knowledge_user"
      POSTGRES_PASSWORD: "qwerty"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./kb-sql:/docker-entrypoint-initdb.d
      - ./study-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
