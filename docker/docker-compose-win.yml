services:

  postgres:
    image: postgres:17
    container_name: knowledge-postgres

    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: qwerty

    ports:
      - "5432:5432"

    volumes:
      - ./kb-scripts:/docker-entrypoint-initdb.d
      - ./knowledge-db:/var/lib/postgresql/data
    networks:
      - knowledge-network


networks:

  knowledge-network:
    name: knowledge-network